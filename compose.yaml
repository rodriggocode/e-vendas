# Sobe apenas o PostgreSQL para desenvolvimento.
# Uso com Podman rootless: podman compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loja
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
